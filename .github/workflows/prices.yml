name: prices
# PRIMARY price bridge. UTC 11:50 and 19:50 Mon-Fri = 12:50 / 20:50 UK until 25 Oct 2026 (BST ends), 11:50 / 19:50 UK after.
on:
  schedule:
    - cron: "50 11 * * 1-5"
    - cron: "50 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build prices.json
        env:
          EIA_KEY: ${{ secrets.EIA_KEY }}
        run: python tools/push_prices.py --out . --no-git
      - name: Commit and push if changed
        run: |
          git config user.name "geo-prices-bot"
          git config user.email "geo-prices-bot@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "prices.json unchanged"
          else
            git commit -m "prices $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
